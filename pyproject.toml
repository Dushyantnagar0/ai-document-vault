[project]
name = "ai-document-vault"
version = "0.1.0"
description = "Self-hosted document analysis and grounded conversation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.7",
  "uvicorn[standard]>=0.34,<1",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "sqlalchemy[asyncio]==2.0.57",
  "psycopg[binary]==3.3.9",
  "alembic==1.20.1",
  "pgvector==0.5.1",
  "celery[redis]==5.7.0",
  "langchain-openai==1.8.0",
  "langchain-text-splitters==1.1.3",
  "pymupdf==1.28.2",
  "python-docx==1.2.0",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "tiktoken>=0.7,<1",
]

[dependency-groups]
ui = ["streamlit==1.67.0"]
dev = [
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.26,<2",
  "pytest-socket>=0.7,<1",
]

[tool.uv]
required-version = "==0.13.8"
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "--strict-markers --disable-socket --allow-unix-socket"
markers = [
  "unit: deterministic isolated behavior",
  "api: HTTP contracts with substituted dependencies",
  "integration: actual isolated PostgreSQL, Redis, filesystem and worker",
  "e2e: complete backend flow (introduced with ingestion)",
  "live: explicitly opted-in chargeable provider checks",
]
