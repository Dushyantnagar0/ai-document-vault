name: document-vault

x-app-environment: &app-environment
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.4-mini-2026-03-17}
  OPENAI_SOURCE_ANSWER_MODEL: ${OPENAI_SOURCE_ANSWER_MODEL:-gpt-6.1-sol}
  OPENAI_ANALYSIS_REVIEW_MODEL: ${OPENAI_ANALYSIS_REVIEW_MODEL:-gpt-6.1-sol}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-document_vault}
  POSTGRES_USER: ${POSTGRES_USER:-document_vault}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  VECTOR_BACKEND: ${VECTOR_BACKEND:-pgvector}
  LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-/app/data/uploads}
  API_PORT: ${API_PORT:-4000}
  UI_PORT: ${UI_PORT:-4005}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
  MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
  MAX_DOCX_EXPANDED_BYTES: ${MAX_DOCX_EXPANDED_BYTES:-104857600}
  MAX_DOCX_ENTRIES: ${MAX_DOCX_ENTRIES:-2000}
  MAX_EXTRACTED_TEXT_BYTES: ${MAX_EXTRACTED_TEXT_BYTES:-2097152}
  MAX_EXTRACTED_TOKENS: ${MAX_EXTRACTED_TOKENS:-100000}
  MAX_DOCUMENT_CHUNKS: ${MAX_DOCUMENT_CHUNKS:-500}
  CHUNK_SIZE_TOKENS: ${CHUNK_SIZE_TOKENS:-800}
  CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-120}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
  EMBEDDING_BATCH_MAX_TOKENS: ${EMBEDDING_BATCH_MAX_TOKENS:-32000}
  ANALYSIS_GROUP_MAX_TOKENS: ${ANALYSIS_GROUP_MAX_TOKENS:-12000}
  ANALYSIS_MAX_OUTPUT_TOKENS: ${ANALYSIS_MAX_OUTPUT_TOKENS:-768}
  SUMMARY_MAX_OUTPUT_TOKENS: ${SUMMARY_MAX_OUTPUT_TOKENS:-1500}
  EVIDENCE_REVIEW_MAX_OUTPUT_TOKENS: ${EVIDENCE_REVIEW_MAX_OUTPUT_TOKENS:-4096}
  INSIGHT_MAX_OUTPUT_TOKENS: ${INSIGHT_MAX_OUTPUT_TOKENS:-3072}
  INSIGHT_MAX_VISIBLE_TOKENS: ${INSIGHT_MAX_VISIBLE_TOKENS:-600}
  OPENAI_REVIEW_REASONING_EFFORT: ${OPENAI_REVIEW_REASONING_EFFORT:-low}
  MAX_DOCUMENT_AI_CALLS: ${MAX_DOCUMENT_AI_CALLS:-64}
  PLANNER_MAX_OUTPUT_TOKENS: ${PLANNER_MAX_OUTPUT_TOKENS:-256}
  QUESTION_MAX_CHARS: ${QUESTION_MAX_CHARS:-4000}
  QUESTION_MAX_TOKENS: ${QUESTION_MAX_TOKENS:-1000}
  CHAT_HISTORY_MAX_TURNS: ${CHAT_HISTORY_MAX_TURNS:-4}
  CHAT_HISTORY_MAX_TOKENS: ${CHAT_HISTORY_MAX_TOKENS:-2000}
  RETRIEVAL_CANDIDATES: ${RETRIEVAL_CANDIDATES:-16}
  RETRIEVAL_MAX_CHUNKS: ${RETRIEVAL_MAX_CHUNKS:-8}
  RETRIEVAL_MAX_TOKENS: ${RETRIEVAL_MAX_TOKENS:-6400}
  CHAT_PROMPT_MAX_TOKENS: ${CHAT_PROMPT_MAX_TOKENS:-12000}
  CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-1200}
  OPENAI_ANSWER_REASONING_EFFORT: ${OPENAI_ANSWER_REASONING_EFFORT:-low}
  OPENAI_EMBEDDING_TIMEOUT_SECONDS: ${OPENAI_EMBEDDING_TIMEOUT_SECONDS:-15}
  OPENAI_GENERATION_TIMEOUT_SECONDS: ${OPENAI_GENERATION_TIMEOUT_SECONDS:-30}
  CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-90}
  CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
  API_MAX_CONCURRENT_AI_REQUESTS: ${API_MAX_CONCURRENT_AI_REQUESTS:-2}
  PROCESSING_MAX_ATTEMPTS: ${PROCESSING_MAX_ATTEMPTS:-3}
  PROCESSING_DEADLINE_SECONDS: ${PROCESSING_DEADLINE_SECONDS:-1800}
  LANGSMITH_TRACING: "false"
  LANGCHAIN_TRACING_V2: "false"

x-app: &app
  build:
    context: .
    target: runtime
  environment: *app-environment
  volumes:
    - uploads:${LOCAL_STORAGE_DIR:-/app/data/uploads}
  init: true

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-document_vault}
      POSTGRES_USER: ${POSTGRES_USER:-document_vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.2.17-bookworm@sha256:5b816bb37d9707a70f10ef5002ecf8ee431750d397010fc4314c93dca887962f
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  storage-init:
    <<: *app
    user: "0:0"
    environment:
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-/app/data/uploads}
    command: [python, -m, scripts.init_storage]
    restart: "no"
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-4000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    stop_grace_period: 100s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=7)"]
      interval: 10s
      timeout: 8s
      start_period: 15s
      retries: 6
  ui:
    build:
      context: .
      target: runtime
    environment:
      API_BASE_URL: http://api:8000
      PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-4000}
    command: [streamlit, run, ui/app.py, --server.address=0.0.0.0, --server.port=8501, --browser.gatherUsageStats=false]
    ports:
      - "127.0.0.1:${UI_PORT:-4005}:8501"
    depends_on:
      api:
        condition: service_healthy
    init: true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 6
  worker:
    <<: *app
    command: [celery, -A, app.tasks.celery_app:app, worker, --loglevel=INFO, "--hostname=worker@%h", --queues=ingestion]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -m, app.tasks.health]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 6

volumes:
  postgres-data:
  redis-data:
  uploads:
